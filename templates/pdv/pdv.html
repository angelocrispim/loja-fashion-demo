<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loja Fashion PDV</title>

    <link
        rel="stylesheet"
        href="/static/css/pdv/pdv.css"
    >

</head>

<body>

    <div class="container">

        <h1>

            LOJA FASHION PDV

        </h1>

        <div class="scanner">

            <label>

                Código do Produto

            </label>

            <input

                type="text"

                id="codigo_produto"

                placeholder="Passe o código de barras..."

                autofocus

            >

        </div>

        <table>

            <thead>

                <tr>

                    <th>Código</th>

                    <th>Produto</th>

                    <th>Qtd</th>

                    <th>Valor</th>

                    <th>Total</th>

                </tr>

            </thead>

            <tbody id="tabela_produtos">

            </tbody>

        </table>

        <div class="rodape">

            <div>

                Itens:

                <strong id="quantidade_itens">

                    0

                </strong>

            </div>

            <div>

                TOTAL

                <h2 id="valor_total">

                    R$ 0,00

                </h2>

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="/static/js/pdv/state.js"></script>

    <script src="/static/js/pdv/config.js"></script>

    <script src="/static/js/pdv/logger.js"></script>

    <script src="/static/js/pdv/events.js"></script>

    <script src="/static/js/pdv/eventBus.js"></script>

    <script src="/static/js/pdv/api.js"></script>

    <script src="/static/js/pdv/scanner.js"></script>

    <script src="/static/js/pdv/carrinho.js"></script>

    <script src="/static/js/pdv/ui.js"></script>

    <script src="/static/js/pdv/app.js"></script>

</body>

</html>
