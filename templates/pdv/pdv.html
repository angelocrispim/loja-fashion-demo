<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loja Fashion PDV</title>

    <link rel="stylesheet"
          href="/static/css/pdv.css">

</head>

<body>

<div class="pdv">

    <!-- ========================= -->
    <!-- TOPO -->
    <!-- ========================= -->

    <header class="topo">

        <div>

            <h1>🛒 LOJA FASHION PDV</h1>

            <span>

                Versão 2.0

            </span>

        </div>

        <div class="operador">

            Operador:

            <strong>

                {{ usuario.nome }}

            </strong>

        </div>

    </header>


    <!-- ========================= -->
    <!-- CONTEÚDO -->
    <!-- ========================= -->

    <div class="conteudo">


        <!-- ========================= -->
        <!-- ESQUERDA -->
        <!-- ========================= -->

        <div class="esquerda">

            <label>

                Código de Barras

            </label>

            <input

                id="codigo_produto"

                type="text"

                placeholder="Passe ou digite o código de barras"

                autocomplete="off"

                autofocus

            >

            <table>

                <thead>

                    <tr>

                        <th>Código</th>

                        <th>Produto</th>

                        <th>Qtd</th>

                        <th>Valor</th>

                        <th>Total</th>

                    </tr>

                </thead>

                <tbody id="tabela_produtos">

                </tbody>

            </table>

        </div>


        <!-- ========================= -->
        <!-- DIREITA -->
        <!-- ========================= -->

        <div class="direita">

            <div class="card-total">

                <div>

                    TOTAL

                </div>

                <h2 id="valor_total">

                    R$ 0,00

                </h2>

            </div>


            <label>

                Desconto

            </label>

            <input

                id="desconto"

                type="number"

                value="0"

            >


            <label>

                Forma de Pagamento

            </label>

            <label>

                Forma de Pagamento

            </label>

            <select id="forma_pagamento">

                <option value="Dinheiro">

                    Dinheiro

                </option>

                <option value="PIX">

                    PIX

                </option>

                <option value="Cartão Débito">

                    Cartão Débito

                </option>

                <option value="Cartão Crédito">

                    Cartão Crédito

                </option>

            </select>

            <label>

                Valor Recebido

            </label>

            <input

                id="valor_recebido"

                type="number"

                step="0.01"

                placeholder="0,00"

            >

            <label>

                Troco

            </label>

            <div id="troco">

                R$ 0,00

            </div>

            <div class="valor-final">

                Valor Final

                <h2 id="valor_final">

                    R$ 0,00

                </h2>

            </div>


            <button

                id="btn_finalizar"

                onclick="Pagamento.processarPagamento()"

                class="btn-verde"

            >

                FINALIZAR VENDA

            </button>


            <button

                id="btn_cancelar"

                onclick="Venda.cancelar()"

                class="btn-vermelho"

            >

                CANCELAR VENDA

            </button>


            <button

                id="btn_fechar"

                class="btn-cinza"

            >

                FECHAR CAIXA

            </button>

        </div>

    </div>

</div>

<!-- MODAL PIX -->

<div id="modal_pix" class="modal-pix">

    <div class="modal-pix-box">

        <h2>Pagamento PIX</h2>

        <div id="pix_qrcode">

        </div>

        <p id="pix_status">

            Aguardando pagamento...

        </p>

        <button

            id="confirmar_pix"

            class="btn-verde"

        >

            Confirmar Pagamento

        </button>

        <button

            onclick="Pagamento.fecharModalPix()"

            class="btn-vermelho"

        >

            Cancelar

        </button>

    </div>

</div>


<!-- ========================================== -->
<!-- ESTADO GLOBAL -->
<!-- ========================================== -->

<script>

PDV.operador.id={{usuario.id}};

PDV.operador.nome="{{usuario.nome}}";

</script>


<!-- ========================================== -->
<!-- SCRIPTS -->
<!-- ========================================== -->

<script src="/static/js/pdv/config.js"></script>

<script src="/static/js/pdv/state.js"></script>

<script src="/static/js/pdv/events.js"></script>

<script src="/static/js/pdv/EventBus.js"></script>

<script src="/static/js/pdv/logger.js"></script>

<script src="/static/js/pdv/developer.js"></script>

<script src="/static/js/pdv/health.js"></script>

<script src="/static/js/pdv/api.js"></script>

<script src="/static/js/pdv/scanner.js"></script>

<script src="/static/js/pdv/carrinho.js"></script>

<script src="/static/js/pdv/ui.js"></script>

<script src="/static/js/pdv/pagamento.js"></script>

<script src="/static/js/pdv/venda.js"></script>

<script src="/static/js/pdv/app.js"></script>

</body>

</html>
