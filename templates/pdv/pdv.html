<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loja Fashion PDV</title>

    <link rel="stylesheet"
          href="/static/css/pdv.css">

</head>

<body>

    <!-- ========================= -->
    <!-- CABEÇALHO -->
    <!-- ========================= -->

    <header class="header">

        <div>

            <h1>LOJA FASHION PDV</h1>

            <small>

                Versão 2.0

            </small>

        </div>

        <div class="operador">

            Operador:

            <strong>

                {{ usuario.nome }}

            </strong>

        </div>

    </header>


    <!-- ========================= -->
    <!-- SCANNER -->
    <!-- ========================= -->

    <section class="scanner">

        <input

            id="codigo_produto"

            type="text"

            placeholder="Digite ou passe o código de barras"

            autocomplete="off"

            autofocus

        >

    </section>


    <!-- ========================= -->
    <!-- CONTEÚDO -->
    <!-- ========================= -->

    <main class="conteudo">

        <!-- PRODUTOS -->

        <section class="produtos">

            <table>

                <thead>

                    <tr>

                        <th>Código</th>

                        <th>Produto</th>

                        <th>Qtd</th>

                        <th>Valor</th>

                        <th>Total</th>

                    </tr>

                </thead>

                <tbody id="tabela_produtos">

                </tbody>

            </table>

        </section>


        <!-- LATERAL -->

        <aside class="painel">

            <h2>Total</h2>

            <div
                class="valor-total"
                id="valor_total">

                R$ 0,00

            </div>

            <br>

            <label>

                Forma de Pagamento

            </label>

            <select id="forma_pagamento">

                <option value="Dinheiro">

                    Dinheiro

                </option>

                <option value="PIX">

                    PIX

                </option>

                <option value="Débito">

                    Cartão Débito

                </option>

                <option value="Crédito">

                    Cartão Crédito

                </option>

            </select>

            <br><br>

            <button id="btn_finalizar">

                FINALIZAR VENDA

            </button>

            <button id="btn_cancelar">

                CANCELAR VENDA

            </button>

        </aside>

    </main>


    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <footer>

        Loja Fashion PDV © 2026

    </footer>


    <!-- ========================= -->
    <!-- DADOS DO OPERADOR -->
    <!-- ========================= -->

    <script src="/static/js/pdv/config.js"></script>

    <script src="/static/js/pdv/state.js"></script>

    <script>

        PDV.operador.id = {{ usuario.id }};

        PDV.operador.nome = "{{ usuario.nome }}";

    </script>


    <!-- ========================= -->
    <!-- MÓDULOS -->
    <!-- ========================= -->

    <script src="/static/js/pdv/events.js"></script>

    <script src="/static/js/pdv/eventBus.js"></script>

    <script src="/static/js/pdv/logger.js"></script>

    <script src="/static/js/pdv/developer.js"></script>

    <script src="/static/js/pdv/health.js"></script>

    <script src="/static/js/pdv/api.js"></script>

    <script src="/static/js/pdv/scanner.js"></script>

    <script src="/static/js/pdv/carrinho.js"></script>

    <script src="/static/js/pdv/ui.js"></script>

    <script src="/static/js/pdv/venda.js"></script>

    <script src="/static/js/pdv/app.js"></script>

</body>

</html>
